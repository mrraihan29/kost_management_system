<!DOCTYPE html>
<html>
<body>
    <h2>Langkah 1: Validasi Penghuni</h2>
    
    {% if messages %}
        {% for message in messages %}
            <div style="color: red;">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Cek Tagihan</button>
    </form>
</body>
</html>
