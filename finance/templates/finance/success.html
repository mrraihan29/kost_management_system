{% extends 'base.html' %}
{% load static %}

{% block title %}Berhasil{% endblock %}

{% block content %}
<div class="container-fluid d-flex align-items-center justify-content-center" style="min-height: 100vh; background-color: #F3F4F6;">
    <div class="col-md-6 col-lg-4 text-center">
        
        <div class="card shadow border-0 rounded-4 p-5">
            <div class="mb-4">
                <!-- Ikon Centang Animasi CSS Sederhana -->
                <div style="width: 80px; height: 80px; background-color: #D1FAE5; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;">
                    <i class="fas fa-check fa-3x text-success"></i>
                </div>
            </div>
            
            <h2 class="brand-font fw-bold text-dark mb-3">Terima Kasih!</h2>
            <p class="text-muted mb-4">
                Bukti pembayaran Anda telah berhasil kami terima. Admin akan segera melakukan verifikasi.
            </p>
            
            <div class="d-grid">
                <a href="{% url 'public_payment_step1' %}" class="btn btn-primary py-3 fw-bold" style="background-color: var(--color-primary); border: none;">
                    Kembali ke Halaman Utama
                </a>
            </div>
        </div>

        <div class="mt-4 text-muted small">
            &copy; 2025 Evy Kost Management
        </div>

    </div>
</div>
{% endblock %}
