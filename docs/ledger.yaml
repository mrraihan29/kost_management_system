  # --- Round 2 (owner numbered answers 1-12 map to Q14-Q25) ---
  - id: R-012
    type: requirement
    version: 1
    status: active
    topic: 4
    answer: "setuju"
    recommendation: "Tanggal tetap sesuai tanggal mulai kontrak (masuk tanggal 10, tagihan selalu tanggal 10). Tanggal itu tidak bergeser walau penghuni membayar terlambat."
    statement: "Critical. As Staff at Ancol, I want each room's cycle date to equal the contract start day of month so that billing dates never drift; a late payment does not move the cycle date."
    acceptance:
      - "A contract starting on the 10th gets invoices dated the 10th of every month"
      - "Paying an invoice late leaves the next invoice's cycle date unchanged"
      - "A start day of 29-31 clamps to the last day of shorter months"

  - id: R-013
    type: requirement
    version: 1
    status: active
    topic: 4
    answer: "setuju"
    recommendation: "Terbit otomatis 7 hari sebelum tanggal siklus kamar itu, tanpa staff menekan tombol, jatuh tempo 10 hari setelah tanggal siklus."
    statement: "Critical. As Staff at Ancol, I want each room's invoice issued automatically 7 days before its cycle date, due 10 days after the cycle date, so that nobody has to trigger it."
    acceptance:
      - "A daily job creates the invoice for a per-room-cycle contract when the cycle date is 7 days away"
      - "The invoice due date equals the cycle date plus 10 days"
      - "Running the job twice creates no duplicate invoice"

