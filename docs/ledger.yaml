# Decision ledger for the Evy Kost Management (EKM) revision.
# Schema and rules: naobi-sdlc references/ledger.md
schema_version: 1
project: evy-kost-management
test_globs:
  - "tests_simulation.py"
  - "tests_postgres_concurrency.py"
  - "**/tests.py"
  - "e2e/**/test_*.py"
  - "**/tests/test_*.py"
entries:
  - id: R-001
    type: requirement
    version: 1
    status: active
    topic: 1
    answer: "ya benar"
    recommendation: "Tiga pengguna. Owner ingin melihat kondisi semua lokasi dan uang masuk. Staff lokasi ingin menagih, memverifikasi bayaran, dan mencatat listrik dari HP. Penghuni ingin tahu tagihannya dan membayar tanpa bingung. Tidak ada pengguna lain."
    statement: "The product serves exactly three user types: Owner (sees all locations and income), Staff (bills, verifies payments and records electricity for one location, from a phone) and Tenant (sees their invoice and pays without confusion)."
    acceptance:
      - "Every screen is reachable by exactly one of the roles Owner, Staff or Tenant"
      - "No fourth role or account type exists"
    links:
      tickets: ["EKM-15@1", "EKM-31@1"]

  - id: R-002
    type: requirement
    version: 1
    status: active
    topic: 1
    answer: "setuju dengan alur kamu! terutama alur keluar tagihan. kan disini ada 3 kost berbeda, kost ancol itu tagihan keluar sesuai dengan masing masing kamar terakhir bayar kapan. 2 kost lain nya tagihan muncul serentak ketika admin serentakkan keluarkan tagihan"
    recommendation: "Tiga alur ini yang jadi prioritas: (a) penghuni baru dari pendaftaran, pilih kamar, sampai tagihan pertama; (b) siklus tagihan bulanan dari generate, input listrik, bayar, sampai verifikasi; (c) portal penghuni dengan PIN."
    statement: "The revision prioritises three flows: tenant onboarding (register, assign room, first invoice), the monthly billing cycle (issue, electricity, pay, verify) and the tenant portal. Invoice issuing is the top priority: the Ancol location issues invoices per room on that room's own cycle, the two other locations issue all invoices at once when Staff triggers it."
    acceptance:
      - "Each of the three flows can be completed end to end without leaving its guided path"
      - "At Ancol, each room's invoice is issued on that room's own cycle date"
      - "At the two other locations, one Staff action issues the invoices for every active contract of that location"
    links:
      tickets: ["EKM-20@1", "EKM-21@1"]

  - id: R-003
    type: requirement
    version: 1
    status: active
    topic: 2
    answer: "setuju"
    recommendation: "Staff baru bisa menyelesaikan verifikasi pembayaran dan input listrik dari HP tanpa dibantu dalam waktu di bawah 2 menit per tagihan, dan penghuni bisa mengunggah bukti bayar di bawah 3 menit pada percobaan pertama."
    statement: "A first-time Staff user completes payment verification and electricity entry on a phone, unaided, in under 2 minutes per invoice; a Tenant uploads a payment proof in under 3 minutes on the first attempt."
    acceptance:
      - "Timed walkthrough: Staff verifies one payment and records one meter reading on a 375px viewport in under 120 seconds"
      - "Timed walkthrough: Tenant goes from PIN entry to upload confirmation in under 180 seconds"
    links:
      tickets: ["EKM-30@1", "EKM-36@1"]

  - id: D-001
    type: decision
    version: 1
    status: active
    topic: 3
    answer: "setuju"
    recommendation: "Revisi di atas kode yang ada. Model data dan aturan finansial dipertahankan (185 test lulus); yang dirombak adalah alur, struktur halaman, tampilan, dan kode view yang berulang."
    statement: "The revision is done in place on the existing codebase: the data model and financial rules are kept, while flows, page structure, visual design and duplicated view code are reworked."

  - id: R-004
    type: requirement
    version: 1
    status: active
    topic: 3
    answer: "setuju"
    recommendation: "Di luar cakupan: aplikasi mobile native, payment gateway, akun login penghuni dengan email, dan fitur multi-pemilik. Rilis pertama hanya merapikan fitur yang sudah ada, tanpa fitur baru."
    statement: "Out of scope: native mobile app, payment gateway, tenant email login and multi-owner support. The first release only reworks existing features and adds none."
    acceptance:
      - "The first release contains no feature absent from the current application"
      - "No payment-gateway, native-app or tenant-account code exists"
    links:
      tickets: ["EKM-32@1", "EKM-33@1"]

  - id: R-005
    type: requirement
    version: 1
    status: active
    topic: 5
    answer: "sekarang 3 lokasi, campuran antar kos kapasitasnya. ada yang 80 tapi kita anggap ada 3 lokasi masing masing lokasi ada 80 kamar"
    statement: "The system is sized for 3 locations of 80 rooms each (240 rooms); main pages respond in under 1 second at that size."
    acceptance:
      - "With seed data of 3 locations x 80 rooms and 12 months of invoices, dashboard, invoice list and room list each render in under 1000 ms at p95"
    links:
      tickets: ["EKM-37@1"]

