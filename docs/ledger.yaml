    statement: "Owner accesses all locations, Staff only their assigned location, Tenant signs in with location + room number + 6-digit PIN; the application meets OWASP ASVS 5.0 Level 2."
    acceptance:
      - "Staff requests for another location's rooms, tenants, invoices, costs or tickets are denied"
      - "Tenant portal access requires a matching location, room number and active-contract PIN, rate limited"

