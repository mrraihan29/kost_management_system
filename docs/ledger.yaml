    statement: "Critical. As Staff at a simultaneous-billing location, I want one action that issues the chosen month's invoices for every active contract, after showing how many will be created, so that billing happens once and predictably. Invoices are dated the 1st and due the 11th."
    acceptance:
      - "The action shows the number of invoices to be created before confirmation"
      - "Confirming creates one invoice per active contract dated the 1st and due the 11th of the chosen month"
      - "Repeating the action for the same month creates no duplicate invoice"

