[project]
name = "evy-kost-management"
version = "0.1.0"
description = "Rent collection for the Evy kost locations (Django)."
requires-python = ">=3.14"
dependencies = [
    "asgiref==3.13.0",
    "dj-database-url==3.1.2",
    "Django==6.1.3",
    "django-axes==9.1.0",
    "django-csp==4.0",
    "et_xmlfile==2.0.0",
    "Faker==40.63.0",
    "gunicorn==27.0.1",
    "openpyxl==3.1.5",
    "packaging==26.4",
    "pillow==13.0.0",
    "psycopg[binary]==3.3.9",
    "python-dateutil==4.0.0",
    "python-dotenv==1.2.4",
    "six==1.17.0",
    "sqlparse==0.6.1",
    "tzdata==2026.6",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
    "pyright",
    "mutmut",
    "django-types>=0.24.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["tests_*.py", "tests.py", "test_*.py"]
testpaths = ["."]
# The doctest plugin would collect the old test_all.txt log as a doctest file.
addopts = "-p no:doctest"
norecursedirs = [".git", ".venv", "venv", "node_modules", "graphify-out", ".impeccable", ".commandcode", "media", "staticfiles"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["*/migrations/*", "graphify-out", ".impeccable", ".commandcode", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
# E501: long lines in legacy views and Indonesian UI strings; the formatter wraps code,
# and new modules stay under the limit. Remove when the legacy views are rewritten.
ignore = ["E501"]

[tool.pyright]
include = ["config", "core", "finance", "tenants", "users"]
exclude = ["**/migrations", "**/__pycache__"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
# Strict for modules created from EKM-12 on (CONSTRAINTS.md exception X-1).
strict = ["config/settings_test.py", "config/tests_settings.py", "core/scoping.py", "core/tests/test_scoping.py", "finance/portal.py", "finance/tests/test_portal_access.py", "core/navigation.py", "core/tests/test_shell.py", "core/formats.py", "core/tests/test_formats.py", "finance/templatetags/finance_extras.py", "core/tests/test_location_settings.py", "finance/billing.py", "finance/management/commands/issue_due_invoices.py", "finance/tests/test_billing_cycle.py", "finance/tests/test_billing_simultaneous.py", "finance/tests/test_first_invoice.py", "finance/tests/test_meter_gating.py", "finance/services.py", "finance/management/commands/mark_late_invoices.py", "finance/tests/test_late.py"]
reportMissingModuleSource = false
