{% extends 'base.html' %}
{% load static %}

{% block title %}Berhasil{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        
        <div class="card-paper p-5">
            <div class="mb-4">
                <div style="width: 80px; height: 80px; background-color: #D1FAE5; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin: 0 auto;">
                    <i class="fas fa-check fa-3x text-success"></i>
                </div>
            </div>
            
            <h2 class="brand-font fw-bold text-dark mb-3">Password Diperbarui!</h2>
            <p class="text-muted mb-4">
                Password akun Anda telah berhasil diubah. Silakan gunakan password baru untuk login selanjutnya.
            </p>
            
            <div class="d-grid gap-2 col-8 mx-auto">
                <a href="{% url 'dashboard' %}" class="btn btn-ink py-2">
                    Kembali ke Dashboard
                </a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
